<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Coffee — Режим оффлайн</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #FBF9F5;
      color: #24211D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #EAE3D2;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(180, 83, 9, 0.08);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #FEF3C7;
      color: #B45309;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 30px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #24211D;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #78716C;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background: #B45309;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      border-radius: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #92400E;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F5EFEB;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      color: #78716C;
      margin-top: 18px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F59E0B;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>Нет подключения к сети</h1>
    <p>Похоже, в зале или цокольном этаже временно пропал мобильный сигнал. Сохраненное меню доступно оффлайн.</p>
    <button class="btn" onclick="window.location.reload()">Обновить страницу</button>
    <div>
      <span class="badge">
        <span class="pulse-dot"></span>
        Авто-переподключение при появлении сети
      </span>
    </div>
  </div>
</body>
</html>
