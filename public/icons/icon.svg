<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="#FBF9F5" />
  
  <!-- Outer Badge -->
  <circle cx="256" cy="256" r="190" fill="url(#warmGrad)" filter="url(#shadow)" />

  <!-- Coffee Cup & Fork Minimalist Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Steam waves -->
    <path d="M216 130 Q 224 105 216 80" />
    <path d="M256 125 Q 264 100 256 75" />
    <path d="M296 130 Q 304 105 296 80" />

    <!-- Cup Body -->
    <path d="M168 180 L 180 300 C 182 340, 330 340, 332 300 L 344 180 Z" fill="#FFFFFF" fill-opacity="0.12" />
    
    <!-- Cup Handle -->
    <path d="M344 200 C 385 200, 385 270, 338 270" />

    <!-- Saucer / Plate -->
    <path d="M140 370 L 372 370" stroke-width="24" />
  </g>

  <!-- Small Amber Sparkle -->
  <polygon points="370,120 376,134 390,140 376,146 370,160 364,146 350,140 364,134" fill="#FDE68A" />
</svg>
